<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Adressetiketten — DK-11208</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 24px; }
    h1 { font-size: 20px; margin-bottom: 6px; color: #fff; }
    .subtitle { font-size: 13px; color: #8a9bb5; margin-bottom: 16px; }
    .bar { background: #16213e; border: 1px solid #2e4057; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .bar label { font-size: 10px; color: #8a9bb5; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 3px; }
    .bar input[type=text] { background: #0f3460; border: 1px solid #2e4057; border-radius: 6px; color: #e0e0e0; font-size: 13px; padding: 7px 10px; width: 175px; }
    .field { display: flex; flex-direction: column; }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; align-self: flex-end; }
    .btn-save  { background: #2e4057; color: #e0e0e0; }
    .btn-print { background: linear-gradient(135deg, #e07b39, #c0392b); color: white; font-size: 14px; padding: 10px 24px; }
    .btn-clear { background: #3a1a1a; color: #ff8080; font-size: 12px; padding: 7px 12px; }
    .btn:hover { opacity: 0.85; }

    .stamp-bar { background: #16213e; border: 1px solid #2e4057; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; }
    .stamp-bar h3 { font-size: 13px; color: #e0e0e0; margin-bottom: 10px; }
    .stamp-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .file-label { display: inline-block; padding: 8px 16px; background: #0f3460; border: 1px dashed #2e4057; border-radius: 8px; cursor: pointer; font-size: 13px; color: #8a9bb5; }
    .file-label:hover { border-color: #e07b39; color: #e0e0e0; }
    #pdfInput { display: none; }
    #pdfStatus { font-size: 12px; color: #8a9bb5; font-family: monospace; }

    .offset-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0f1e36; border: 1px solid #2e4057; border-radius: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .offset-row label { font-size: 12px; color: #e0e0e0; }
    .offset-row input[type=number] { background: #0f3460; border: 1px solid #2e4057; border-radius: 6px; color: #e0e0e0; font-size: 14px; font-weight: 600; padding: 6px 10px; width: 70px; text-align: center; }
    .offset-row .hint { font-size: 11px; color: #8a9bb5; }

    .stamp-preview-wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .stamp-debug-wrap label { font-size: 10px; color: #8a9bb5; display: block; margin-bottom: 4px; }
    #stampDebugImg { display: none; height: 110px; max-width: 320px; border: 1px solid #e07b39; border-radius: 4px; background: #fff; object-fit: contain; }

    .debug-box { background: #0f1e36; border: 1px solid #2e4057; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 11px; font-family: monospace; color: #8a9bb5; white-space: pre-wrap; max-height: 80px; overflow-y: auto; }

    /* ── Screen label: 90×38mm ratio → 540×228px, stamp = 50% width = 270px ── */
    .label-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
    .label {
      width: 540px; height: 186px;
      background: #fff; border-radius: 4px; border: 1px solid #ccc;
      padding: 10px 8px 5px 12px;
      display: flex; flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); overflow: hidden;
    }
    .label-top { display: flex; flex: 1; gap: 6px; min-height: 0; }
    .label-left { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .label-right { width: 268px; flex-shrink: 0; display: flex; align-items: stretch; justify-content: flex-end; }
    .stamp-img { width: 266px; height: 100%; object-fit: contain; object-position: center right; }
    .stamp-placeholder { width: 266px; border: 1px dashed #ccc; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #bbb; text-align: center; }

    .label-sender { font-size: 8px; color: #777; white-space: normal; overflow: hidden; border-bottom: 0.5px solid #eee; padding-bottom: 3px; margin-bottom: 4px; line-height: 1.35; }
    .label-recipient { font-size: 16px; color: #111; line-height: 1.6; flex: 1; }
    .label-recipient .name { font-weight: 700; font-size: 20px; display: block; margin-bottom: 2px; }
    .label-recipient div { display: block; }
    .label-order { font-size: 7px; color: #bbb; text-align: right; margin-top: 4px; flex-shrink: 0; }

    /* ── PRINT: DK-11208 = 90mm × 38mm ── */
    @media print {
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      h1, .subtitle, .bar, .stamp-bar, .debug-box { display: none !important; }
      @page { size: 90mm 38mm; margin: 0; }
      .label-grid { display: block; margin: 0; padding: 0; }
      .label {
        width: 90mm; height: 38mm;
        border: none !important; border-radius: 0 !important; box-shadow: none !important;
        padding: 1.5mm 1mm 1mm 2.5mm;
        page-break-after: always; break-after: page;
        background: white !important;
      }
      .label-top { gap: 0; }
      .label-right { width: 45mm; }          /* exactly 50% of 90mm */
      .stamp-img { width: 45mm; max-height: 35mm; object-fit: contain; object-position: center right; }
      .stamp-placeholder { width: 45mm; height: 33mm; font-size: 6pt; }
      .label-sender { font-size: 5.5pt; color: #555 !important; padding-bottom: 1mm; margin-bottom: 1mm; white-space: normal; line-height: 1.3; }
      .label-recipient { font-size: 10pt; color: #000 !important; line-height: 1.3; }
      .label-recipient .name { font-size: 12pt; }
      .label-order { font-size: 5pt; color: #aaa !important; }
    }
  </style>
</head>
<body>
  <h1>🖨 Adressetiketten — DK-11208 (38×90mm)</h1>
  <p class="subtitle" id="labelCount"></p>

  <div class="bar">
    <div class="field"><label>Absender Name</label><input type="text" id="rName" placeholder="Max Mustermann"/></div>
    <div class="field"><label>Straße + Nr.</label><input type="text" id="rStreet" placeholder="Musterstraße 1"/></div>
    <div class="field"><label>PLZ + Ort</label><input type="text" id="rCity" placeholder="12345 Musterstadt"/></div>
    <div class="field"><label>Land</label><input type="text" id="rCountry" placeholder="Deutschland" style="width:120px"/></div>
    <button class="btn btn-save"  id="btnSave">💾 Speichern</button>
    <button class="btn btn-print" id="btnPrint">🖨 Alle drucken</button>
  </div>

  <div class="stamp-bar">
    <h3>📮 Briefmarken — Deutsche Post Internetmarke PDF (1 Marke pro Seite)</h3>
    <div class="stamp-row">
      <label class="file-label" for="pdfInput">📄 PDF hochladen…</label>
      <input type="file" id="pdfInput" accept="application/pdf"/>
      <span id="pdfStatus">Noch kein PDF geladen</span>
      <button class="btn btn-clear" id="btnClearStamps">✕ Marken löschen</button>
      <button class="btn btn-clear" id="btnToggleDebug" style="margin-left:auto;">🐛 Log anzeigen</button>
    </div>

    <div class="offset-row">
      <label>🎯 Erste verwendete Marke (Seite):</label>
      <input type="number" id="stampOffset" min="1" max="99" value="1"/>
      <span class="hint">Seite 1 = Marke 1, Seite 2 = Marke 2, … Bereits verbrauchte überspringen.</span>
    </div>

    <div class="stamp-preview-wrap">
      <div id="stampPreview"></div>
      <div class="stamp-debug-wrap">
        <label>🔍 Erste Marke — Vorschau:</label>
        <img id="stampDebugImg" alt="Stamp preview"/>
      </div>
    </div>
  </div>

  <div class="debug-box" id="debugBox" style="display:none;">⏳ Initialisiere…</div>
  <div class="label-grid" id="labelGrid"></div>

  <script src="lib/pdf.min.js"></script>
  <script src="labels.js"></script>
</body>
</html>
