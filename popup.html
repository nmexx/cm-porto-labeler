<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cardmarket Order Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e; color: #e0e0e0;
      width: 320px; min-height: 220px; padding: 20px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; border-bottom: 1px solid #2e4057; padding-bottom: 14px; }
    .logo { width: 36px; height: 36px; background: linear-gradient(135deg, #e07b39, #c0392b); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .header-text h1 { font-size: 14px; font-weight: 700; color: #fff; }
    .header-text p  { font-size: 11px; color: #8a9bb5; }
    .status-box { background: #16213e; border: 1px solid #2e4057; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; min-height: 48px; }
    .status-label { font-size: 11px; color: #8a9bb5; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-text { font-size: 13px; color: #e0e0e0; line-height: 1.4; }
    .progress-bar-wrap { background: #2e4057; border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; display: none; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #e07b39, #e0a050); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
    .progress-text { font-size: 11px; color: #8a9bb5; margin-top: 5px; display: none; }
    .warning { background: #2d1b00; border: 1px solid #7a4500; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #ffb347; margin-bottom: 14px; line-height: 1.5; display: none; }
    .btn { width: 100%; padding: 11px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-bottom: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #e07b39, #c0392b); color: white; }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }
    .btn-secondary { background: #2e4057; color: #e0e0e0; }
    .btn-secondary:hover:not(:disabled) { background: #3a5070; }
    .btn-labels { background: linear-gradient(135deg, #1a6b3a, #157a35); color: white; }
    .btn-labels:hover:not(:disabled) { opacity: 0.9; }
    .divider { border: none; border-top: 1px solid #2e4057; margin: 4px 0 10px; }
    .section-label { font-size: 10px; color: #8a9bb5; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    .results-count { text-align: center; font-size: 12px; color: #8a9bb5; margin-top: 2px; }
    .done-icon { color: #4caf50; font-size: 18px; margin-right: 6px; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #8a9bb5; border-top-color: #e07b39; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🃏</div>
    <div class="header-text">
      <h1>Order Exporter</h1>
      <p>Cardmarket · Bezahlt orders</p>
    </div>
  </div>
  <div class="warning" id="warning"></div>
  <div class="status-box">
    <div class="status-label">Status</div>
    <div class="status-text" id="statusText">Bereit. Öffne die Bezahlt-Seite und klicke Start.</div>
    <div class="progress-bar-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div class="section-label">Scraping</div>
  <button class="btn btn-primary" id="btnStart">▶ Start Scraping</button>
  <hr class="divider"/>
  <div class="section-label">Export</div>
  <button class="btn btn-secondary" id="btnDownload" disabled>⬇ Download CSV</button>
  <button class="btn btn-labels"    id="btnLabels"   disabled>🖨 Labels drucken (DK-11209)</button>
  <div class="results-count" id="resultsCount"></div>
  <script src="popup.js"></script>
</body>
</html>
